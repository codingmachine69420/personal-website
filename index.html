    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the display face stylesheet — it's the first thing visible -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Serif+4:wght@400;600&family=Barlow:wght@500;600&display=swap" />

      rel="stylesheet"
    />
    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing.
      (function () {
        var p = new URLSearchParams(window.location.search).get('p')
        if (p) {
          window.history.replaceState(null, null, '/' + p)
        }
      })()
    </script>
